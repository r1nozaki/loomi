spring.application.name=loomi-backend

# JWT Configuration
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjdXJlS2V5VGhhdEF0TGVhc3QzMkJ5dGVzIQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loomi_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:/app/uploads}

# Static Resources
spring.web.resources.static-locations=file:uploads/
spring.web.resources.add-mappings=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.loomi=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:OFF}
